services:
  mermaid-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      RENDER_CONCURRENCY: "2"
      MAX_IN_FLIGHT: "16"
    init: true
    read_only: true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
