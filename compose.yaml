services:
  mermaid-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      RENDER_WORKERS: "2"
      RENDER_QUEUE_SIZE: "4"
      MAX_IN_FLIGHT: "64"
      RENDER_MISS_RPS: "5"
      RENDER_MISS_BURST: "6"
    read_only: true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
