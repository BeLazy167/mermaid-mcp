primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]

[env]
  ADDR = ":8080"
  RENDER_WORKERS = "4"
  RENDER_QUEUE_SIZE = "8"
  MAX_IN_FLIGHT = "512"
  RENDER_MISS_RPS = "10"
  RENDER_MISS_BURST = "12"
  TRUSTED_CLIENT_IP_HEADER = "Fly-Client-IP"
  CACHE_MAX_BYTES = "268435456"
  CACHE_MAX_ENTRIES = "20000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 512

  [[http_service.checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "60s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "performance-4x"
  memory = "8gb"
